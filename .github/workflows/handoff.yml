name: handoff

# Event-driven handoff between the Architect and the Stack Builder.
# No clock. Events only.
#
#   architect-ready   -> ping the Builder (it has work)
#   builder-delivered -> tell the Architect + notify the operator (it has a result)
#
on:
  issues:
    types: [opened, labeled]
  push:
    paths:
      - "handoff/**"
  repository_dispatch:
    types: [architect-ready, builder-delivered]

permissions:
  issues: write
  contents: read

jobs:
  notify:
    if: >
      github.event_name == 'repository_dispatch' ||
      github.event_name == 'push' ||
      contains(github.event.issue.labels.*.name, 'builder-task')
    runs-on: ubuntu-latest
    steps:
      - name: Architect says READY — ping the Builder
        if: github.event.action == 'architect-ready'
        env:
          BUILDER_HOOK: ${{ secrets.BUILDER_WEBHOOK_URL }}
        run: |
          if [ -z "$BUILDER_HOOK" ]; then
            echo "::error::No BUILDER_WEBHOOK_URL secret set — cannot reach the Builder."
            exit 1
          fi
          curl -sS -X POST "$BUILDER_HOOK" -H "Content-Type: application/json" \
            -d '{"event":"architect-ready","repo":"'"$GITHUB_REPOSITORY"'"}'
          echo "Builder pinged."

      - name: Builder says DELIVERED — notify the operator
        if: github.event.action == 'builder-delivered'
        env:
          OPERATOR_HOOK: ${{ secrets.OPERATOR_WEBHOOK_URL }}
        run: |
          echo "The Builder has delivered a result. Audit is due."
          if [ -n "$OPERATOR_HOOK" ]; then
            curl -sS -X POST "$OPERATOR_HOOK" -H "Content-Type: application/json" \
              -d '{"event":"builder-delivered","repo":"'"$GITHUB_REPOSITORY"'"}'
          fi

      - name: Comment the task on a new task issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "**Builder task received.** Read `handoff/queue.json`, build from the `order` it names, write `receipts/<id>_receipt.md`, then comment `DELIVERED <id>` and fire `repository_dispatch` type `builder-delivered`."
            });
